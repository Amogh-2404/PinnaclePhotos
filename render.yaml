databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  - type: redis
    name: mysite-redis
    plan: free
    ipAllowList: []

  - type: web
    plan: free
    name: mysite
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn bookmarks.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mysite-redis
          type: redis
          property: connectionString
      - key: RENDER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,photos.ramogh.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://photos.ramogh.com,http://localhost,http://127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4